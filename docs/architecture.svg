<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#444;stroke-width:1.4;rx:8}
      .store{fill:#eef4ff;stroke:#2b5fb3;stroke-width:1.6}
      .llm{fill:#fff6e8;stroke:#c27a00;stroke-width:1.4}
      .gate{fill:#eefaf0;stroke:#2e8b47;stroke-width:1.4}
      .t{fill:#222}
      .s{fill:#666;font-size:11px}
      .h{font-weight:600;font-size:14px;fill:#222}
      line,path.e{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <text x="20" y="28" class="h">INGEST  (python -m ingest --path data/corpus)</text>
  <rect x="20" y="45" width="130" height="58" class="box"/>
  <text x="85" y="70" text-anchor="middle" class="t">SEC EDGAR 10-Ks</text>
  <text x="85" y="88" text-anchor="middle" class="s">5 semiconductor filers</text>

  <rect x="180" y="45" width="140" height="58" class="box"/>
  <text x="250" y="70" text-anchor="middle" class="t">Section-aware chunker</text>
  <text x="250" y="88" text-anchor="middle" class="s">deterministic chunk_id</text>

  <rect x="350" y="45" width="160" height="58" class="llm"/>
  <text x="430" y="66" text-anchor="middle" class="t">Claude extraction</text>
  <text x="430" y="82" text-anchor="middle" class="s">enum ontology · Pydantic · retry</text>
  <text x="430" y="96" text-anchor="middle" class="s">cache by doc SHA-256 · budget cap</text>

  <rect x="540" y="45" width="160" height="58" class="box"/>
  <text x="620" y="66" text-anchor="middle" class="t">Entity resolution</text>
  <text x="620" y="82" text-anchor="middle" class="s">normalize · seeds · acronym</text>
  <text x="620" y="96" text-anchor="middle" class="s">embedding ≥ tuned threshold</text>

  <line x1="150" y1="74" x2="178" y2="74"/>
  <line x1="320" y1="74" x2="348" y2="74"/>
  <line x1="510" y1="74" x2="538" y2="74"/>

  <rect x="760" y="40" width="210" height="70" class="store"/>
  <text x="865" y="64" text-anchor="middle" class="h">Neo4j</text>
  <text x="865" y="82" text-anchor="middle" class="s">MERGE-only · every edge has</text>
  <text x="865" y="96" text-anchor="middle" class="s">source_chunk_id(s) + evidence</text>
  <line x1="700" y1="74" x2="758" y2="74"/>

  <rect x="760" y="150" width="210" height="70" class="store"/>
  <text x="865" y="174" text-anchor="middle" class="h">pgvector (HNSW)</text>
  <text x="865" y="192" text-anchor="middle" class="s">same chunk_id · section_path · date</text>
  <text x="865" y="206" text-anchor="middle" class="s">entity_ids[]</text>
  <path class="e" d="M250,103 L250,185 L758,185"/>
  <text x="470" y="178" class="s">fastembed BGE-small (local)</text>

  <path d="M935,110 L935,148" stroke="#2b5fb3" stroke-width="2.2" stroke-dasharray="5 4" fill="none"/>
  <text x="928" y="134" class="s" text-anchor="end" style="fill:#2b5fb3;font-weight:600">shared chunk_id</text>

  <line x1="20" y1="250" x2="980" y2="250" stroke="#bbb" stroke-dasharray="4 4"/>

  <text x="20" y="282" class="h">QUERY  (POST /ask {question})</text>
  <rect x="20" y="300" width="130" height="54" class="box"/>
  <text x="85" y="332" text-anchor="middle" class="t">question</text>

  <rect x="170" y="292" width="200" height="70" class="llm"/>
  <text x="270" y="315" text-anchor="middle" class="t">Router (Haiku 5.5)</text>
  <text x="270" y="332" text-anchor="middle" class="s">GRAPH | VECTOR | BOTH + slots</text>
  <text x="270" y="348" text-anchor="middle" class="s">low confidence → BOTH · JSONL log</text>
  <line x1="150" y1="327" x2="168" y2="327"/>

  <rect x="400" y="275" width="200" height="64" class="box"/>
  <text x="500" y="297" text-anchor="middle" class="t">Entity linker → node IDs</text>
  <text x="500" y="313" text-anchor="middle" class="s">Cypher template library</text>
  <text x="500" y="327" text-anchor="middle" class="s">(model fills parameters only)</text>

  <rect x="400" y="370" width="200" height="50" class="box"/>
  <text x="500" y="392" text-anchor="middle" class="t">Vector search top-k</text>
  <text x="500" y="408" text-anchor="middle" class="s">HNSW, tuned ef_search</text>

  <path class="e" d="M370,315 L398,307"/>
  <path class="e" d="M370,345 L398,393"/>
  <path class="e" d="M600,300 C700,300 740,150 758,85"/>
  <path class="e" d="M600,395 C700,395 760,260 790,222"/>

  <rect x="640" y="440" width="190" height="80" class="box"/>
  <text x="735" y="462" text-anchor="middle" class="t">Context assembly</text>
  <text x="735" y="478" text-anchor="middle" class="s">paths → sentences · dedupe</text>
  <text x="735" y="492" text-anchor="middle" class="s">GRAPH FACTS | PASSAGES</text>
  <text x="735" y="506" text-anchor="middle" class="s">graph path → source text</text>
  <path class="e" d="M865,220 L865,470 L832,470"/>

  <rect x="380" y="440" width="220" height="80" class="llm"/>
  <text x="490" y="462" text-anchor="middle" class="t">Grounded synthesis (Opus 5.5)</text>
  <text x="490" y="480" text-anchor="middle" class="s">1 citation per sentence</text>
  <text x="490" y="494" text-anchor="middle" class="s">citations ⊆ retrieved chunk_ids</text>
  <text x="490" y="508" text-anchor="middle" class="s">reject → regenerate once → refuse</text>
  <line x1="640" y1="480" x2="602" y2="480"/>

  <rect x="150" y="450" width="190" height="60" class="gate"/>
  <text x="245" y="474" text-anchor="middle" class="t">{answer, citations[],</text>
  <text x="245" y="492" text-anchor="middle" class="t">route_used, graph_paths[]}</text>
  <line x1="380" y1="480" x2="342" y2="480"/>
</svg>
