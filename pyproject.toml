[project]
name = "kgrag"
version = "0.1.0"
description = "Hybrid knowledge-graph + vector RAG over SEC 10-K filings, with a vector-only baseline benchmark."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "neo4j>=5.20",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "numpy>=1.26",
    "fastembed>=0.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kgrag*", "ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running Neo4j + Postgres (docker compose up)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
